version: '3.8'

services:
  # Redis service
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Next.js app service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slot-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules

# Define volumes and networks
volumes:
  redis_data:

networks:
  app-network:
    driver: bridge